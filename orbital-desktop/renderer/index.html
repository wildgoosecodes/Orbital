<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orbital Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: #020617;
        color: #f1f5f9;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 24px 16px;
        border-bottom: 1px solid #1e293b;
      }
      header span {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 15px;
      }
      main {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
      }
      .hidden { display: none !important; }
      label {
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      input[type="email"], input[type="password"] {
        width: 100%;
        margin-top: 4px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 8px 10px;
        color: white;
        font-size: 14px;
      }
      input:focus { outline: none; border-color: #6366f1; }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary {
        background: transparent;
        border: 1px solid #1e293b;
        color: #cbd5e1;
      }
      button.secondary:hover { background: #0f172a; }
      #error { color: #fb7185; font-size: 13px; min-height: 16px; }
      #briefing-text {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 16px;
        font-size: 14px;
        line-height: 1.6;
        color: #cbd5e1;
        min-height: 100px;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #94a3b8; }
      footer {
        padding: 12px 24px;
        border-top: 1px solid #1e293b;
        display: flex;
        justify-content: flex-end;
      }
      footer button { font-size: 12px; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <header>
      <span>Orbital Desktop</span>
    </header>

    <main>
      <section id="login-view">
        <p id="error"></p>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>
        <div style="margin-top: 12px">
          <label for="password">Password</label>
          <input type="password" id="password" />
        </div>
        <button id="signin-btn" style="margin-top: 16px; width: 100%">Sign in</button>
      </section>

      <section id="main-view" class="hidden">
        <div class="row">
          <label>Today's briefing</label>
          <button id="speak-again-btn" class="secondary">Speak it again</button>
        </div>
        <div id="briefing-text">Loading your briefing…</div>

        <div class="toggle-row" style="margin-top: 8px">
          <input type="checkbox" id="startup-toggle" />
          <label for="startup-toggle" style="text-transform: none; font-weight: 400; color: #94a3b8;">
            Launch Orbital Desktop when I start my computer
          </label>
        </div>
      </section>
    </main>

    <footer>
      <button id="signout-btn" class="secondary hidden">Sign out</button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
