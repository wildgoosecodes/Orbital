<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orbital Desktop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
        background: #020617;
        color: #f1f5f9;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 24px 16px;
        border-bottom: 1px solid #1e293b;
        flex-shrink: 0;
      }
      header span {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 15px;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #login-view {
        padding: 24px;
        overflow-y: auto;
      }
      #main-view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .hidden { display: none !important; }
      label {
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      input[type="email"], input[type="password"] {
        width: 100%;
        margin-top: 4px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 8px 10px;
        color: white;
        font-size: 14px;
      }
      input:focus { outline: none; border-color: #6366f1; }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #4338ca; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary {
        background: transparent;
        border: 1px solid #1e293b;
        color: #cbd5e1;
      }
      button.secondary:hover { background: #0f172a; }
      #error { color: #fb7185; font-size: 13px; min-height: 16px; }

      #chat-messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble-row { display: flex; }
      .bubble-row.user { justify-content: flex-end; }
      .bubble-row.assistant { justify-content: flex-start; }
      .bubble {
        max-width: 85%;
        border-radius: 12px;
        padding: 10px 13px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .bubble.user { background: #4f46e5; color: white; }
      .bubble.assistant { background: #0f172a; border: 1px solid #1e293b; color: #cbd5e1; }
      .bubble.pending { color: #64748b; }

      #mic-row {
        flex-shrink: 0;
        padding: 16px 24px;
        border-top: 1px solid #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #mic-btn {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-size: 22px;
      }
      #mic-btn.recording { background: #dc2626; }
      #mic-btn.recording:hover { background: #b91c1c; }
      #mic-status { font-size: 12px; color: #64748b; min-height: 16px; }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #94a3b8;
        padding: 0 24px 16px;
        flex-shrink: 0;
      }
      footer {
        padding: 12px 24px;
        border-top: 1px solid #1e293b;
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
      }
      footer button { font-size: 12px; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <header>
      <span>Orbital Desktop</span>
    </header>

    <main>
      <section id="login-view">
        <p id="error"></p>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" />
        </div>
        <div style="margin-top: 12px">
          <label for="password">Password</label>
          <input type="password" id="password" />
        </div>
        <button id="signin-btn" style="margin-top: 16px; width: 100%">Sign in</button>
      </section>

      <section id="main-view" class="hidden">
        <div id="chat-messages"></div>

        <div id="mic-row">
          <button id="mic-btn" aria-label="Start recording">🎙️</button>
          <div id="mic-status"></div>
        </div>

        <div class="toggle-row">
          <input type="checkbox" id="startup-toggle" />
          <label for="startup-toggle" style="text-transform: none; font-weight: 400; color: #94a3b8;">
            Launch Orbital Desktop when I start my computer
          </label>
        </div>
      </section>
    </main>

    <footer>
      <button id="signout-btn" class="secondary hidden">Sign out</button>
    </footer>

    <script src="wavEncoder.js"></script>
    <script src="app.js"></script>
    <script src="../node_modules/onnxruntime-web/dist/ort.min.js"></script>
    <script src="wakeword.js"></script>
  </body>
</html>
